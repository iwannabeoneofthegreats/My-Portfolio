<!-- // ფოფაფების დივები -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">შესვლა</button>
      <button class="auth-tab" data-tab="register">რეგისტრაცია</button>
    </div>

    <!-- ლოგინ ფორმა ოღონდ ფოფაპი -->
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="ელ. ფოსტა" required />
      <input type="password" id="loginPassword" placeholder="პაროლი" required />
      <button type="submit" class="btn">შესვლა</button>    </form>

    <!-- რეგისტრაციის ფორმა -->
    <form id="registerForm" hidden>
      <input type="text" id="regFirstName" placeholder="სახელი" required />
      <input type="text" id="regLastName" placeholder="გვარი" required />
      <input type="email" id="regEmail" placeholder="ელ. ფოსტა" required />
      <input type="password" id="regPassword" placeholder="პაროლი (მინ. 8 სიმბოლო)" required />
      <input type="number" id="regAge" placeholder="ასაკი" required />
      <input type="text" id="regPhone" placeholder="ტელეფონი" value="+995" required />
      <input type="text" id="regAddress" placeholder="მისამართი" required />
      <input type="text" id="regZipcode" placeholder="ZIP კოდი (მაგ. 0100)" required />
      <input type="url" id="regAvatar" placeholder="ავატარის სურათის ლინკი (URL)" />
      <select id="regGender" required>
        <option value="">აირჩიე სქესი</option>
        <option value="MALE">მამრობითი</option>
        <option value="FEMALE">მდედრობითი</option>
        <option value="OTHER">სხვა</option>
      </select>
      <button type="submit" class="btn">რეგისტრაცია</button>
    </form>
  </div>
</div>
